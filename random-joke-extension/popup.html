<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Joke</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      min-height: 220px;
      padding: 24px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #101418;
      color: #f5f7fa;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .label {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #8b98a5;
      margin-bottom: 16px;
    }

    #joke {
      font-size: 16px;
      line-height: 1.5;
      color: #f5f7fa;
    }

    #delivery {
      display: block;
      margin-top: 12px;
      color: #9aa7b4;
      font-size: 15px;
    }

    .footer {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      color: #101418;
      background: #7ee0b8;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    #status {
      font-size: 12px;
      color: #8b98a5;
    }
  </style>
</head>
<body>
  <div>
    <div class="label">Random joke</div>
    <p id="joke">Press the button for a joke.</p>
    <span id="delivery"></span>
  </div>

  <div class="footer">
    <span id="status"></span>
    <button id="newJoke">New joke</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
